version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18.1
    container_name: dreamfinora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dreamfinora
      POSTGRES_PASSWORD: dreamfinora_dev_password_change_in_production
      POSTGRES_DB: dreamfinora_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamfinora"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Optional - for caching/sessions if needed later)
  # Uncomment when needed
  # redis:
  #   image: redis:7-alpine
  #   container_name: dreamfinora_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
  # redis_data:  # Uncomment when Redis is added

