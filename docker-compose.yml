services:
  # PostgreSQL Database
  postgres:
    image: postgres:18.1
    container_name: dreamfinora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dreamfinora
      POSTGRES_PASSWORD: dreamfinora_dev_password_change_in_production
      POSTGRES_DB: dreamfinora_dev
    ports:
      # 5432 is already used by local Windows PostgreSQL on this machine.
      # Use 5433 locally to avoid admin-only service shutdown.
      - "5433:5432"
    volumes:
      # Postgres 18+ expects a mount at /var/lib/postgresql (not .../data)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamfinora -d dreamfinora_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Optional - for caching/sessions if needed later)
  # Uncomment when needed
  # redis:
  #   image: redis:7-alpine
  #   container_name: dreamfinora_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
  # redis_data:  # Uncomment when Redis is added

